name: 部署到 GitHub Pages

# 推到 main 就自动部署；也可以在 Actions 页面手动点「Run workflow」重跑
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要这两项权限。默认只有 read，不写会报 403
permissions:
  contents: read
  pages: write
  id-token: write

# 同时跑两次部署会互相覆盖，排队等前一个跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        # 用 install 而不是 ci：rollup / esbuild 的平台原生包是 optional dependency，
        # npm ci 在跨平台场景下有已知 bug（npm/cli#4828）会漏装，构建时报
        # "Cannot find module @rollup/rollup-linux-x64-gnu"，退出码 1。
        # install 会补齐这些可选依赖；版本仍由 package-lock.json 锁住。
        #
        # 注意：package-lock.json 必须包含全部平台的 @rollup/rollup-* 条目（25 个）。
        # 若曾在本机装依赖时中断过，lock 可能残缺，需要在无 lock、无 node_modules 的
        # 干净状态下重新 npm install 生成，否则 Linux 构建机装不到对应平台包。
        run: npm install --no-audit --no-fund

      # site.config.js 含 CloudBase 环境 ID，不进仓库，构建时从仓库 Secrets 生成。
      # 这样线上站点能连云端，而公开仓库里翻不到地址。
      - name: 生成站点配置
        run: |
          cat > public/site.config.js <<'EOF'
          (function (root) {
              root.SITE_CONFIG = {
                  contactEndpoint: '${{ secrets.CONTACT_ENDPOINT }}',
                  contentEndpoint: '${{ secrets.CONTENT_ENDPOINT }}',
                  siteUrl: 'https://lee-orlando.github.io/lyq-portfolio-vue/'
              };
          })(typeof window !== 'undefined' ? window : globalThis);
          EOF

      - name: 构建
        run: npm run build
        env:
          # Pages 的项目站点地址带仓库名，静态资源路径必须加这个前缀，否则 JS/CSS 全 404
          BASE_PATH: /lyq-portfolio-vue/

      - name: 打包产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
